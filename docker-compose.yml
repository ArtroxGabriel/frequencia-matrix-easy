services:
  frequencia:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frequencia-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_PATH=/app/data/frequencia.db
      - DEV_MODE=true
    volumes:
      - frequencia_data:/app/data

  synapse-init:
    image: matrixdotorg/synapse:latest
    environment:
      - SYNAPSE_SERVER_NAME=localhost
      - SYNAPSE_REPORT_STATS=no
    volumes:
      - synapse_data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ ! -f /data/homeserver.yaml ]; then
          python -m synapse.app.homeserver --config-path /data/homeserver.yaml --data-directory /data --generate-config --server-name "$$SYNAPSE_SERVER_NAME" --report-stats="$$SYNAPSE_REPORT_STATS"
          printf '\nenable_registration: true\nenable_registration_without_verification: true\n' >> /data/homeserver.yaml
        fi
        grep -q '^rc_login:' /data/homeserver.yaml || printf 'rc_login:\n  address: {per_second: 1000, burst_count: 1000}\n  account: {per_second: 1000, burst_count: 1000}\n  failed_attempts: {per_second: 1000, burst_count: 1000}\nrc_registration: {per_second: 1000, burst_count: 1000}\n' >> /data/homeserver.yaml
        sed -i -e 's/^    - ::1$/    - 0.0.0.0/' -e '/^    - 127.0.0.1$/d' /data/homeserver.yaml
        sed -i 's#filename: /homeserver.log#filename: /data/homeserver.log#' /data/localhost.log.config
        chown -R 991:991 /data

  synapse:
    image: matrixdotorg/synapse:latest
    container_name: frequencia-synapse
    restart: unless-stopped
    ports:
      - "8008:8008"
    environment:
      - SYNAPSE_CONFIG_PATH=/data/homeserver.yaml
    volumes:
      - synapse_data:/data
    depends_on:
      synapse-init:
        condition: service_completed_successfully

  element:
    image: vectorim/element-web:latest
    container_name: frequencia-element
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - synapse

volumes:
  frequencia_data:
  synapse_data:
