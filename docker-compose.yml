services:
  frequencia:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frequencia-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_PATH=/app/data/frequencia.db
      - DEV_MODE=true
    volumes:
      - frequencia_data:/app/data

  synapse-init:
    image: matrixdotorg/synapse:latest
    environment:
      - SYNAPSE_SERVER_NAME=localhost
      - SYNAPSE_REPORT_STATS=no
    volumes:
      - synapse_data:/data
    command: >
      sh -c "if [ ! -f /data/homeserver.yaml ]; then
               python -m synapse.app.homeserver --config-path /data/homeserver.yaml --generate-config --server-name $$SYNAPSE_SERVER_NAME --report-stats $$SYNAPSE_REPORT_STATS;
               sed -i 's/enable_registration: false/enable_registration: true/' /data/homeserver.yaml;
             fi"

  synapse:
    image: matrixdotorg/synapse:latest
    container_name: frequencia-synapse
    restart: unless-stopped
    ports:
      - "8008:8008"
    environment:
      - SYNAPSE_CONFIG_PATH=/data/homeserver.yaml
    volumes:
      - synapse_data:/data
    depends_on:
      synapse-init:
        condition: service_completed_successfully

  element:
    image: vectorim/element-web:latest
    container_name: frequencia-element
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - synapse

volumes:
  frequencia_data:
  synapse_data:
