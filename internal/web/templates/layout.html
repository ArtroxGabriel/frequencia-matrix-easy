<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frequência - Matrix Element Widget</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans p-4">
    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden">
        <!-- Header -->
        <header class="bg-indigo-700 text-white px-6 py-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
            <div>
                <h1 class="text-xl font-bold tracking-tight">{{if .Course.CourseName}}{{.Course.CourseName}}{{else}}Frequência da Turma{{end}}</h1>
                <p class="text-xs text-indigo-200">Sala: <code class="bg-indigo-800 px-1.5 py-0.5 rounded">{{.RoomID}}</code></p>
            </div>
            <div class="text-xs text-indigo-200">
                Professor: <span class="font-medium text-white">{{.UserID}}</span>
            </div>
        </header>

        <!-- Navigation Tabs -->
        <nav class="flex border-b border-slate-200 bg-slate-100 text-sm font-medium">
            <button class="px-4 py-3 hover:text-indigo-600 focus:outline-none border-b-2 border-transparent hover:border-indigo-600 transition"
                    hx-get="/widget/tab/setup?roomId={{.RoomID}}&openIdToken={{.Token}}"
                    hx-target="#tab-content">
                ⚙️ Configuração
            </button>
            <button class="px-4 py-3 hover:text-indigo-600 focus:outline-none border-b-2 border-transparent hover:border-indigo-600 transition"
                    hx-get="/widget/tab/roster?roomId={{.RoomID}}&openIdToken={{.Token}}"
                    hx-target="#tab-content">
                👥 Alunos
            </button>
            <button class="px-4 py-3 hover:text-indigo-600 focus:outline-none border-b-2 border-indigo-600 text-indigo-700 transition"
                    hx-get="/widget/tab/attendance?roomId={{.RoomID}}&openIdToken={{.Token}}"
                    hx-target="#tab-content">
                📝 Chamada Diária
            </button>
            <button class="px-4 py-3 hover:text-indigo-600 focus:outline-none border-b-2 border-transparent hover:border-indigo-600 transition"
                    hx-get="/widget/tab/summary?roomId={{.RoomID}}&openIdToken={{.Token}}"
                    hx-target="#tab-content">
                📊 Resumo & Exportação
            </button>
        </nav>

        <!-- Dynamic Content Area -->
        <main id="tab-content" class="p-6">
            {{if .IsSetupTab}}
                {{template "setup.html" .}}
            {{else}}
                {{template "attendance.html" .}}
            {{end}}
        </main>
    </div>
</body>
</html>
